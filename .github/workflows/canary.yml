name: canary
on:
  workflow_dispatch: {}
jobs:
  c:
    runs-on: ubuntu-latest
    env:
      TOK: ${{ secrets.FB_PAGE_TOKEN }}
      PID: ${{ secrets.FB_PAGE_ID }}
      AID: ${{ secrets.FACEBOOK_APP_ID }}
      SEC: ${{ secrets.FB_APP_SECRET }}
    steps:
      - name: canary
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          TOK = os.environ["TOK"].strip()
          PID = os.environ["PID"].strip()
          AID = os.environ.get("AID", "").strip()
          SEC = os.environ.get("SEC", "").strip()
          def call(url, data=None):
              req = urllib.request.Request(url, data=(urllib.parse.urlencode(data).encode() if data else None), method=("POST" if data is not None else "GET"))
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"_err": e.code, "_body": e.read()[:260].decode(errors="ignore")}
          if AID and SEC:
              dbg = call("https://graph.facebook.com/v21.0/debug_token?input_token=" + TOK + "&access_token=" + AID + "|" + SEC)
              dd = dbg.get("data", {})
              print("DBG: valid=", dd.get("is_valid"), "type=", dd.get("type"), "expires=", dd.get("expires_at"), "err=", (json.dumps(dbg)[:200] if not dd else ""))
          me = call("https://graph.facebook.com/v21.0/" + PID + "?fields=name&access_token=" + TOK)
          print("ME-READ:", json.dumps(me)[:150])
          ph = call("https://graph.facebook.com/v21.0/" + PID + "/photos",
                    {"url": "https://raw.githubusercontent.com/cheerfulspirits999-bit/azad-daily-cards/main/cards/fallback.png",
                     "published": "false", "access_token": TOK})
          print("PHOTO-DRAFT:", json.dumps(ph)[:200])
          pid = ph.get("id")
          if pid:
              dele = call("https://graph.facebook.com/v21.0/" + pid + "?access_token=" + TOK, data=b"" if False else None)
              req = urllib.request.Request("https://graph.facebook.com/v21.0/" + pid + "?method=DELETE&access_token=" + TOK, data=b"", method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print("DRAFT-DELETED:", r.read()[:40])
              except urllib.error.HTTPError as e:
                  print("DELETE-ERR:", e.read()[:120].decode(errors="ignore"))
          PY

name: tok-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          TOK: ${{ secrets.FB_PAGE_TOKEN }}
          PID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          tok, pid = os.environ["TOK"], os.environ["PID"]
          def g(url):
              try:
                  with urllib.request.urlopen(url + ("&" if "?" in url else "?") +
                                              "access_token=" + tok, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"http_error": e.code, "body": e.read()[:260].decode(errors="ignore")}
          print("TOKENINFO:", json.dumps(g(f"https://graph.facebook.com/v21.0/debug_token?input_token={tok}"), ensure_ascii=False)[:420])
          print("PAGE:", json.dumps(g(f"https://graph.facebook.com/v21.0/{pid}?fields=name,instagram_business_account.id,instagram_business_account.username"), ensure_ascii=False)[:340])
          PY

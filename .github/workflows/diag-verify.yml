name: diag-verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
      RU_PROVIDER: ${{ vars.RU_PROVIDER }}
      RU_MODEL: ${{ vars.RU_MODEL }}
      RU_BASE_URL: ${{ vars.RU_BASE_URL }}
      RU_TIMEOUT: 40
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FREELLM_API_KEY: ${{ secrets.FREELLM_API_KEY }}
      FREELLM_BASE_URL: ${{ vars.FREELLM_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: regression - the working lane must still work
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "news_agent")
          import roman_urdu as ru, autod
          print("ENGINE:", ru.ENGINE, "| configured:", ru.configured())
          print("FREELLM_BASE_URL set:", bool(os.environ.get("FREELLM_BASE_URL")))
          print("freellm base resolves to:", repr(autod._freellm_base()))
          lanes = [l for l, _ in autod._ru_attempts()]
          print("LANE ORDER:", lanes[:6])
          print("freellm lane present:", "freellm" in lanes)
          B = ["A person was held with live ammunition at RGIA, police said.",
               "MBBS students have begun a strike in Karimnagar."]
          for lbl, kw in autod._ru_attempts():
              if not lbl.startswith("gemini"):
                  continue
              out = ru.translate_lines(list(B), **kw)
              m = out.get("method") if isinstance(out, dict) else "list"
              print("  %-28s method=%s" % (lbl, m))
              if m == "llm":
                  for t in (out.get("lines") or []):
                      print("       >", str(t)[:120])
                  break
          PY

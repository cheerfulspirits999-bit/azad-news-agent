name: link-check
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
jobs:
  l:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pynacl -q
      - name: app-business link probe + auto-mint
        continue-on-error: true
        env:
          SU: ${{ secrets.SU_TMP }}
          PID: ${{ secrets.FB_PAGE_ID }}
          AID: ${{ secrets.FACEBOOK_APP_ID }}
          SEC: ${{ secrets.FB_APP_SECRET }}
          GH: ${{ secrets.AGENT_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.parse, urllib.error
          SU = os.environ["SU"].strip()
          PID = os.environ["PID"].strip()
          AID = os.environ["AID"].strip()
          SEC = os.environ["SEC"].strip()
          GH = os.environ["GH"].strip()
          REPO = os.environ["REPO"].strip()
          APP = AID + "|" + SEC
          def call(url, data=None, method=None):
              qd = urllib.parse.urlencode(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=qd, method=method or ("POST" if data else "GET"))
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"_err": e.code, "_body": e.read()[:200].decode(errors="ignore")}
              except Exception as e:
                  return {"_exc": str(e)[:150]}
          b = call("https://graph.facebook.com/v21.0/122180291947298?fields=name,link&access_token=" + urllib.parse.quote(APP))
          print("LC LINK:", json.dumps(b)[:220])
          if b.get("name"):
              r2 = call("https://graph.facebook.com/v21.0/122180291947298/access_tokens",
                        {"system_user_id": "122095644171503362", "asset_id": PID, "asset_type": "PAGE",
                         "permitted_function": "MANAGE", "access_token": APP})
              print("LC MINT:", json.dumps(r2)[:200])
              t2 = r2.get("access_token")
              if t2:
                  ph = call("https://graph.facebook.com/v21.0/" + PID + "/feed", {"message": "phantom", "published": "false", "access_token": t2})
                  print("LC PHANTOM:", json.dumps(ph)[:150])
                  if ph.get("id"):
                      call("https://graph.facebook.com/v21.0/" + ph["id"], {"method": "DELETE", "access_token": t2})
                      def gh(url, data=None, method=None):
                          req = urllib.request.Request("https://api.github.com" + url,
                              data=json.dumps(data).encode() if data else None, method=method or ("POST" if data else "GET"),
                              headers={"Authorization": "Bearer " + GH, "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
                          with urllib.request.urlopen(req, timeout=30) as r3:
                              b3 = r3.read()
                          return json.loads(b3) if b3.strip() else {}
                      pk = gh("/repos/" + REPO + "/actions/secrets/public-key")
                      from nacl.public import PublicKey, SealedBox
                      box = SealedBox(PublicKey(base64.b64decode(pk["key"])))
                      for nm in ["FB_PAGE_TOKEN", "FB_SU_TOKEN"]:
                          gh("/repos/" + REPO + "/actions/secrets/" + nm,
                             {"key_id": pk["key_id"], "encrypted_value": base64.b64encode(box.encrypt(t2.encode())).decode()}, "PUT")
                      print("LC RESULT: HEALED - never-expiring page token stored in vault")
                  else:
                      print("LC RESULT: minted but phantom refused; still blocked")
              else:
                  print("LC RESULT: link exists but mint refused:", json.dumps(r2)[:150])
          else:
              print("LC RESULT: NO LINK YET - app not in business; posting stays blocked")
          PY

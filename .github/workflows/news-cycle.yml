# Azad Daily news agent - runs ONE monitor+publish cycle every hour on
# GitHub's own servers (free), then commits the agent memory (dedupe state)
# back to this repo. No computer or browser tab needs to stay open.
name: news-cycle
on:
  schedule:
    - cron: "5,20,35,50 * * * *"          # every 30 min (:10 and :40 UTC)
  workflow_dispatch:            # "Run workflow" test button
    inputs:
      catchup:
        description: "1 = drain missed stories now at 30-min spacing"
        required: false
        default: "0"
permissions:
  contents: write                 # allows committing the state back
concurrency:
  group: news-cycle               # never two cycles at once (no double posts)
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: token self-renewal (auth.py)
        continue-on-error: true   # never block posting; publish fails loud if token dies
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
          RU_PROVIDER: ${{ vars.RU_PROVIDER }}
          RU_MODEL: ${{ vars.RU_MODEL }}
          RU_BASE_URL: ${{ vars.RU_BASE_URL }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_REFRESH_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: python3 news_agent/auth.py
      - name: run one monitor + publish cycle
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
          RU_PROVIDER: ${{ vars.RU_PROVIDER }}
          RU_MODEL: ${{ vars.RU_MODEL }}
          RU_BASE_URL: ${{ vars.RU_BASE_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          DIGEST_CATCHUP: ${{ github.event.inputs.catchup || '0' }}
        run: python3 news_agent/autod.py --once
      - name: commit agent memory
        if: always()
        run: |
          git config user.name "azad-news-agent"
          git config user.email "agent@localhost"
          git add news_agent/state news_agent/stories
          if ! git diff --cached --quiet; then
            git commit -m "cycle $(date -u +%FT%TZ)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || true
          fi

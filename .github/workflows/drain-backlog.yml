name: drain-backlog
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
      RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
      RU_PROVIDER: ${{ vars.RU_PROVIDER }}
      RU_MODEL: ${{ vars.RU_MODEL }}
      RU_BASE_URL: ${{ vars.RU_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -q
      - name: drain unposted morning stories
        run: |
          python3 - <<'PY'
          import os, json, glob, re, subprocess, sys
          ST = "news_agent/stories"
          files = sorted(glob.glob(os.path.join(ST, "auto-digest-2026-10-02-s*.json")))
          def hhmm(f):
              m = re.search(r"-s(\d{4})\.json$", f)
              return int(m.group(1)) if m else -1
          window = [f for f in files if 1000 <= hhmm(f) <= 1559]
          print("DRAIN window 10:00-15:59:", [os.path.basename(f) for f in window])
          pub = json.load(open("news_agent/state/published.json", encoding="utf-8"))
          done = {p.get("story") for p in pub}
          posted = skipped = failed = 0
          for f in window:
              key = os.path.basename(f).replace(".json", "")
              if key in done:
                  print("SKIP already-published:", key); skipped += 1; continue
              r = subprocess.run([sys.executable, "news_agent/publish.py", f, "--publish"],
                                 capture_output=True, text=True, timeout=240)
              tail = (r.stdout or r.stderr or "").strip().splitlines()[-3:]
              if r.returncode == 0:
                  posted += 1
                  print("POSTED:", key, "|", " / ".join(tail)[:180])
              else:
                  failed += 1
                  print("FAILED:", key, "rc=", r.returncode, "|", " / ".join(tail)[:200])
              import time; time.sleep(6)
          print("DRAIN SUMMARY posted=", posted, "skipped=", skipped, "failed=", failed)
          PY
      - name: commit memory
        if: always()
        run: |
          git config user.name "azad-news-agent"
          git config user.email "agent@localhost"
          git add news_agent/state news_agent/stories
          if ! git diff --cached --quiet; then
            git commit -m "drain-backlog $(date -u +%FT%TZ)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || true
          fi

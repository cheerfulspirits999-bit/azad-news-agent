# Watchdog v2 (29 Sep): the v1 flaw was that it only DISPATCHED a wake-up run
# while a frozen runner kept holding a slot - the wake queued behind the very
# zombie that had stalled the cadence (3 freezes on 29 Sep: #242/#262/#265).
# v2 checks LIVENESS (does cycle state still advance?), cancels any stuck run
# (in_progress with stale state, or stale queued backlog), then respawns.
# Cadence is otherwise guaranteed by the relay handoff inside news-cycle.yml.
name: watchdog
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: liveness guard - cancel frozen, wake cadence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, datetime, urllib.request
          AGE = 999
          try:
              d = json.load(open("news_agent/state/last_cycle.json"))
              t = datetime.datetime.fromisoformat(d["at"])
              AGE = int((datetime.datetime.now(t.tzinfo)
                         - t).total_seconds() // 60)
          except Exception:
              pass
          def api(path, method="GET"):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + os.environ["REPO"] + path,
                  method=method,
                  headers={"Authorization": "***" + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      b = r.read()
                      return json.loads(b) if b else {}
              except Exception as e:
                  print("api err:", str(e)[:120])
                  return None
          runs = (api("/actions/workflows/news-cycle.yml/runs?per_page=6")
                  or {}).get("workflow_runs", [])
          live = [r for r in runs if r["status"] in
                  ("queued", "pending", "requested", "in_progress")]
          now = datetime.datetime.now(datetime.timezone.utc)
          def run_age_min(r):
              try:
                  s = r.get("run_started_at") or r.get("created_at")
                  t = datetime.datetime.fromisoformat(
                      s.replace("Z", "+00:00"))
                  return int((now - t).total_seconds() // 60)
              except Exception:
                  return 0
          print(f"state age {AGE} min; live runs: "
                f"{[(r['run_number'], r['status']) for r in live]}")
          stale = AGE > 35  # >35min no state commit = frozen (a live digest
          # can legitimately run ~20min through the salvage-model chain)
          if not stale and live:
              print("healthy - cadence advancing, nothing to do")
              raise SystemExit(0)
          if not live and AGE <= 35:
              print("no live run but state fresh (relay handoff window) - ok")
              raise SystemExit(0)
          for r in live:
              # never kill a run that is younger than the stale threshold -
              # it may be mid-publish; cancel it only once it has also had
              # more time than a worst-case cycle needs
              if r["status"] == "in_progress" and run_age_min(r) < 45:
                  print("run", r["run_number"], "in_progress",
                        run_age_min(r), "min - too young to kill, will recheck")
                  continue
              print("cancel", r["run_number"], r["status"], r["id"])
              api(f"/actions/runs/{r['id']}/cancel", "POST")
          code = api("/actions/workflows/news-cycle.yml/dispatches", "POST")
          print("wake dispatched")
          PY

# Azad Daily relay - 3 Oct replacement for news-cycle.yml.
#
# WHY THIS FILE EXISTS: GitHub is returning 404 on every name-based route for
# this repository (/repos/cheerfulspirits999-bit/azad-news-agent and its
# actions/workflows/{id}/enable endpoint), which left news-cycle.yml stuck at
# disabled_manually with no API path to re-enable it. Reads and writes DO work
# through the repository-ID route (/repositories/1368230601/...), and a workflow
# pushed as a NEW file is active by default - so this is the same publish path,
# under a fresh name, live again.
#
# It is byte-for-byte the same job as news-cycle.yml: token self-renewal, one
# monitor+publish cycle, relay handoff, fail-loud alerting, memory commit.
# Same concurrency group, so it can never double-post alongside news-cycle.
#
# Page lock is unchanged and enforced in code: publish._lock_page() raises on
# any page id other than Azad Daily 1538679366414544.
name: azad-relay
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      catchup:
        description: "1 = drain missed stories now at 30-min spacing"
        required: false
        default: "0"
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: news-cycle               # never two cycles at once (no double posts)
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: token self-renewal (auth.py)
        continue-on-error: true   # never block posting; publish fails loud if token dies
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
          RU_PROVIDER: ${{ vars.RU_PROVIDER }}
          RU_MODEL: ${{ vars.RU_MODEL }}
          RU_BASE_URL: ${{ vars.RU_BASE_URL }}
          FB_APP_ID: ${{ secrets.FB_APP_ID || secrets.FACEBOOK_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_REFRESH_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
          FB_SU_TOKEN: ${{ secrets.FB_SU_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: python3 news_agent/auth.py
      - name: run one monitor + publish cycle
        env:
          IG_DUALPOST: ${{ vars.IG_DUALPOST }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_REFRESH_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
          RU_PROVIDER: ${{ vars.RU_PROVIDER }}
          RU_MODEL: ${{ vars.RU_MODEL }}
          RU_BASE_URL: ${{ vars.RU_BASE_URL }}
          RU_TIMEOUT: 40
          RU_DAILY_CAP: 200
          RU_DAILY_HARD: 220
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_KETS }}
          DIGEST_CATCHUP: ${{ github.event.inputs.catchup || '0' }}
          DAEMON_INTERVAL_MIN: "10"
        run: python3 news_agent/autod.py --deadline=330
      - name: relay handoff - queue the successor now
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}"
              "/actions/workflows/azad-relay.yml/dispatches",
              data=json.dumps({"ref": "main"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"})
          try:
              urllib.request.urlopen(req, timeout=30)
              print("successor queued - cadence continues without GitHub's cron")
          except Exception as e:
              print("handoff failed; cron remains as backup:", e)
          PY
      - name: fail loud if publishing was blocked
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          def gh(url, data=None, method=None):
              req = urllib.request.Request(
                  f"https://api.github.com{url}",
                  data=json.dumps(data).encode() if data else None,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json"},
                  method=method or ("POST" if data else "GET"))
              with urllib.request.urlopen(req, timeout=30) as r:
                  b = r.read()
              return json.loads(b) if b.strip() else {}
          repo = os.environ["REPO"]
          try:
              d = gh(f"/repos/{repo}/contents/news_agent/state/pending_publish.json")
              pend = json.loads(base64.b64decode(d["content"]))
          except Exception:
              pend = []
          pend = pend if isinstance(pend, list) else []
          alert = ""
          try:
              d2 = gh(f"/repos/{repo}/contents/news_agent/state/ALERT.md")
              alert = base64.b64decode(d2["content"]).decode()[:600]
          except Exception:
              pass
          if not pend and not alert:
              print("publishing not blocked - nothing pending"); raise SystemExit(0)
          if not pend and alert:
              title = "[ALERT] agent raised a stop alert - attention needed"
              body = ("The pipeline wrote ALERT.md during the last runs:\n\n"
                      + alert + "\n\nRun " + os.environ.get("GITHUB_RUN_ID",""))
              open_issues = gh(f"/repos/{repo}/issues?state=open")
              if not any(i.get("title") == title for i in open_issues):
                  gh(f"/repos/{repo}/issues", {"title": title, "body": body})
                  print("OPENED alert issue from ALERT.md")
              raise SystemExit(0)
          title = "[ALERT] publishing blocked: cards waiting in pending_publish"
          body = (f"{len(pend)} card(s) were built but Facebook refused to accept "
                  "them this run - check FB_PAGE_TOKEN / FB_PAGE_ID secrets and "
                  f"run {os.environ.get('GITHUB_RUN_ID','')} (auth step + publish logs).")
          open_issues = gh(f"/repos/{repo}/issues?state=open")
          if any(i.get("title") == title for i in open_issues):
              print("alert issue already open - skipping duplicate")
          else:
              gh(f"/repos/{repo}/issues", {"title": title, "body": body})
              print("OPENED alert issue:", title)
          PY
      - name: commit agent memory
        if: always()
        run: |
          git config user.name "azad-news-agent"
          git config user.email "agent@localhost"
          git add news_agent/state news_agent/stories
          if ! git diff --cached --quiet; then
            git commit -m "cycle $(date -u +%FT%TZ)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || true
          fi

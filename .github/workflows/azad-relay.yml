# Azad Daily hourly relay - 3 Oct (final shape).
#
# Owner: "maintain hourly cycle only, no duplicates."
#
# One cycle per run, on the hour, every hour. The previous design ran a 5.5-hour
# in-process loop that only committed its memory at the very end, so a cancelled
# or failed run lost every post it had made and the next run could re-pick the
# same stories. Committing after EVERY run keeps published.json - which is what
# the digest builder and publish.dup_check both dedupe against - permanently
# current, which is what makes duplicates structurally impossible.
#
# The hourly cadence is enforced by the digest gate itself (_due = gap_min >= 55
# in autod.py): a run that fires early simply holds and posts nothing, so this
# can never flood the page.
name: azad-relay
on:
  schedule:
    - cron: "0 * * * *"            # one cycle, on the hour, every hour
  workflow_dispatch:
    inputs:
      catchup:
        description: "1 = drain the backlog now (raises the daily card cap 24 -> 30)"
        required: false
        default: "0"
permissions:
  contents: write                 # commit the agent memory after every run
  issues: write                   # fail-loud issue when publishing is blocked
concurrency:
  group: news-cycle               # never two cycles at once (no double posts)
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt -q

      # ---- token self-renewal: only fires when the token is genuinely dead ----
      - name: token self-renewal (auth.py)
        continue-on-error: true   # never block posting; publish fails loud if token dies
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
          RU_PROVIDER: ${{ vars.RU_PROVIDER }}
          RU_MODEL: ${{ vars.RU_MODEL }}
          RU_BASE_URL: ${{ vars.RU_BASE_URL }}
          FB_APP_ID: ${{ secrets.FB_APP_ID || secrets.FACEBOOK_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_REFRESH_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
          FB_SU_TOKEN: ${{ secrets.FB_SU_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: python3 news_agent/auth.py

      # ---- one monitor + publish cycle ----
      - name: run one hourly cycle
        env:
          IG_DUALPOST: "0"                                   # Instagram is OFF
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_REFRESH_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
          RU_PROVIDER: ${{ vars.RU_PROVIDER }}
          RU_MODEL: ${{ vars.RU_MODEL }}
          RU_BASE_URL: ${{ vars.RU_BASE_URL }}
          RU_TIMEOUT: 40
          RU_DAILY_CAP: 200
          RU_DAILY_HARD: 220
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_KETS }}
          DIGEST_CATCHUP: ${{ github.event.inputs.catchup || '0' }}
        run: python3 news_agent/autod.py --once

      # ---- commit memory EVERY run: this is the duplicate guard ----
      - name: commit agent memory
        if: always()
        run: |
          git config user.name "azad-news-agent"
          git config user.email "agent@localhost"
          git add news_agent/state news_agent/stories
          if ! git diff --cached --quiet; then
            git commit -m "hourly cycle $(date -u +%FT%TZ)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || true
          fi

      # ---- fail loud if a card was built but Facebook refused it ----
      - name: fail loud if publishing was blocked
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          def gh(url, data=None, method=None):
              req = urllib.request.Request(
                  f"https://api.github.com{url}",
                  data=json.dumps(data).encode() if data else None,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json"},
                  method=method or ("POST" if data else "GET"))
              with urllib.request.urlopen(req, timeout=30) as r:
                  b = r.read()
              return json.loads(b) if b.strip() else {}
          repo = os.environ["REPO"]
          try:
              d = gh(f"/repos/{repo}/contents/news_agent/state/pending_publish.json")
              pend = json.loads(base64.b64decode(d["content"]))
          except Exception:
              pend = []
          pend = pend if isinstance(pend, list) else []
          if not pend:
              print("nothing pending - publishing is healthy")
              raise SystemExit(0)
          title = "[ALERT] publishing blocked: cards waiting in pending_publish"
          body = (f"{len(pend)} card(s) were built but Facebook refused to accept "
                  "them this run - check FB_PAGE_TOKEN / FB_PAGE_ID secrets and "
                  f"run {os.environ.get('GITHUB_RUN_ID','')}.")
          open_issues = gh(f"/repos/{repo}/issues?state=open")
          if any(i.get("title") == title for i in open_issues):
              print("alert issue already open - skipping duplicate")
          else:
              gh(f"/repos/{repo}/issues", {"title": title, "body": body})
              print("OPENED alert issue:", title)
          PY

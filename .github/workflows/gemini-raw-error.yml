# One-shot: get the RAW error from the Gemini lane - 6 Oct.
#
# The owner added GEMINI_API_KEY, but the probe reported method="fallback",
# ok=False - translate_news() swallows call_llm()'s exception into its
# deterministic dictionary passthrough, so the real reason never reaches the
# log. This calls call_llm() directly and prints the exception verbatim.
name: gemini-raw-error
on:
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt -q
      - name: raw gemini call
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, sys, traceback
          sys.path.insert(0, "news_agent")
          import roman_urdu
          import roman_urdu_translator.roman_urdu as eng

          gk = os.environ.get("GEMINI_API_KEY", "")
          print("GEMINI_API_KEY:", f"set(len={len(gk)})" if gk else "MISSING")
          print("endpoint      :", eng.ENDPOINTS["gemini"])
          print("API_KEYS[gem] :", repr(eng.API_KEYS.get("gemini"))[:40])
          print()

          LINES = ["Telangana government approves a new data centre policy",
                   "Officials say the project will create five thousand jobs",
                   "The cabinet also cleared a single-window clearance system"]

          # 1. configured()?  (the engine's version, not the shim's 0-arg one)
          print("configured(gemini, key):",
                eng.configured("gemini", gk))
          # which key would the engine use if the caller passed NONE?
          resolved = eng.API_KEYS.get("gemini", "")
          print("engine default key for gemini:",
                "OpenRouter key!" if resolved.startswith("sk-or-")
                else ("gemini key" if resolved == gk else repr(resolved[:12])))
          print("RU_API_KEY set:", bool(os.environ.get("RU_API_KEY")))
          print("GEMINI_API_KEY set:", bool(gk))
          import inspect
          print("translate_news params:",
                list(inspect.signature(eng.translate_news).parameters))

          # 2. the raw call_llm - this is what actually raises
          for model in ("gemini-2.5-flash", "gemini-2.0-flash",
                        "gemini-2.5-flash-lite", "gemini-flash-latest"):
              print("=" * 60)
              print("MODEL:", model)
              try:
                  out = roman_urdu.call_llm(
                      "\n".join(LINES), provider="gemini", model=model,
                      api_key=gk, use_few_shot=True)
                  print("  OK ->", repr(out[:220]))
              except Exception as e:
                  print("  RAISED:", type(e).__name__)
                  print("  MSG   :", str(e)[:400])

          # 3. and the engine path the pipeline actually uses
          print("=" * 60)
          print("translate_lines(provider=gemini, model=gemini-2.5-flash)")
          r = roman_urdu.translate_lines(
              LINES, provider="gemini", model="gemini-2.5-flash",
              api_key=gk, use_few_shot=True)
          for k in ("ok", "method", "problems", "warning"):
              print(f"  {k}: {str(r.get(k))[:220]}")
          for l in (r.get("lines") or [])[:3]:
              print("   line >", str(l)[:110])
          PY

# One-shot: get the RAW Gemini error - 6 Oct (v2).
#
# v1 called roman_urdu.call_llm() - the SHIM (news_agent/roman_urdu.py) does not
# expose call_llm, so every model raised AttributeError before any HTTP call was
# made. This calls the ENGINE (roman_urdu_translator.roman_urdu) directly, and
# also does a raw HTTP POST to Gemini so the exact status/body is visible even
# if the engine mangles it.
name: gemini-raw-error
on:
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt -q
      - name: raw gemini call
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, sys, json, urllib.request, urllib.error
          sys.path.insert(0, "news_agent")
          import roman_urdu                                  # the shim
          import roman_urdu_translator.roman_urdu as eng     # the engine

          gk = os.environ.get("GEMINI_API_KEY", "")
          print("GEMINI_API_KEY:", f"set(len={len(gk)})" if gk else "MISSING")
          print("shim ENGINE   :", getattr(roman_urdu, "ENGINE", "?"))
          print("engine has call_llm:", callable(getattr(eng, "call_llm", None)))
          print()

          LINES = ["Telangana government approves a new data centre policy",
                   "Officials say the project will create five thousand jobs",
                   "The cabinet also cleared a single-window clearance system"]

          # ---- 1. raw HTTP straight at Gemini, no engine in the way --------
          print("=" * 64)
          print("1. RAW HTTP to generativelanguage.googleapis.com")
          print("=" * 64)
          for model in ("gemini-2.5-flash", "gemini-2.0-flash",
                        "gemini-2.5-flash-lite"):
              url = (f"https://generativelanguage.googleapis.com/v1beta/models/"
                     f"{model}:generateContent?key={gk}")
              body = json.dumps({"contents": [{"role": "user", "parts": [
                  {"text": "Reply with the single word OK"}]}]}).encode()
              req = urllib.request.Request(url, data=body, method="POST",
                      headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      print(f"  {model:26s} HTTP {r.status}: {r.read()[:200].decode()}")
              except urllib.error.HTTPError as e:
                  print(f"  {model:26s} HTTP {e.code}: {e.read()[:300].decode('utf8','replace')}")
              except Exception as e:
                  print(f"  {model:26s} ERR {type(e).__name__}: {e}")

          # ---- 2. the engine's call_llm - the real path --------------------
          print()
          print("=" * 64)
          print("2. ENGINE call_llm(provider=gemini)")
          print("=" * 64)
          try:
              out = eng.call_llm("\n".join(LINES), provider="gemini",
                                 model="gemini-2.5-flash", api_key=gk,
                                 use_few_shot=True)
              print("  OK ->", repr(out[:260]))
          except Exception as e:
              print("  RAISED:", type(e).__name__)
              print("  MSG   :", str(e)[:500])

          # ---- 3. the shim path the pipeline actually uses ----------------
          print()
          print("=" * 64)
          print("3. SHIM translate_lines(provider=gemini, model=gemini-2.5-flash)")
          print("=" * 64)
          r = roman_urdu.translate_lines(
              LINES, provider="gemini", model="gemini-2.5-flash",
              api_key=gk, use_few_shot=True)
          for k in ("ok", "method", "problems", "warning"):
              print(f"  {k}: {str(r.get(k))[:200]}")
          for l in (r.get("lines") or [])[:3]:
              print("   line >", str(l)[:110])

          # ---- 4. and with few-shot OFF (the shim's own default) ----------
          print()
          print("=" * 64)
          print("4. SHIM translate_lines(use_few_shot=False)")
          print("=" * 64)
          r2 = roman_urdu.translate_lines(
              LINES, provider="gemini", model="gemini-2.5-flash",
              api_key=gk, use_few_shot=False)
          print("  ok:", r2.get("ok"), "| method:", r2.get("method"))
          print("  problems:", str(r2.get("problems"))[:200])
          for l in (r2.get("lines") or [])[:3]:
              print("   line >", str(l)[:110])
          PY

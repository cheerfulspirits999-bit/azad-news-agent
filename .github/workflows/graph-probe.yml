# One-shot Graph probe - 3 Oct.
#
# ALERT.md says "Publishing refused by Facebook 9 cycles in a row, latest rc=5"
# while diag-fb proves the stored page token is_valid=True with
# pages_manage_posts and does not expire until 2026-12-02. So the failure is in
# the POST itself, not the credential. This workflow attempts the real Graph
# calls and prints the FULL error body so the exact Meta reason is on record.
#
# It posts NOTHING visible: the first attempt uses published=false (a phantom
# that is deleted immediately). Only if the phantom succeeds does it make one
# real post, so this doubles as the connection test the owner asked for.
name: graph-probe
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: real Graph calls, full error bodies
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_REFRESH_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID || secrets.FACEBOOK_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error

          PID = os.environ.get("FB_PAGE_ID", "").strip() or "1538679366414544"
          AID = os.environ.get("FB_APP_ID", "").strip()
          SEC = os.environ.get("FB_APP_SECRET", "").strip()
          V = "v21.0"

          def show(label, r):
              body = r.read().decode(errors="ignore")
              print(f"--- {label}: HTTP {r.code}")
              try:
                  print("    " + json.dumps(json.loads(body), indent=2)[:900].replace("\n", "\n    "))
              except Exception:
                  print("    " + body[:600])
              return r.code, body

          def call(url, data=None):
              qd = urllib.parse.urlencode(data).encode() if data else None
              req = urllib.request.Request(url, data=qd,
                      method="POST" if data else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.code, r.read().decode()
              except urllib.error.HTTPError as e:
                  return show(f"HTTPError {url.split('/')[-1].split('?')[0]}", e)
              except Exception as e:
                  print(f"--- EXC {type(e).__name__}: {e}")
                  return 0, ""

          tok = os.environ.get("FB_PAGE_TOKEN", "").strip()
          print("=" * 62)
          print("GRAPH PROBE - page", PID, "| token len", len(tok))
          print("=" * 62)

          # 0. who does this token actually belong to?
          c, b = call(f"https://graph.facebook.com/{V}/me?access_token=" + urllib.parse.quote(tok))
          print("me ->", c, b[:200])

          # 1. phantom post - proves create permission without publishing
          print("\n### 1. PHANTOM POST (published=false)")
          c, b = call(f"https://graph.facebook.com/{V}/{PID}/feed", {
              "message": "azad-graph-probe (phantom, not published)",
              "published": "false", "access_token": tok})
          print("    ->", c, b[:300])
          phid = None
          try:
              phid = json.loads(b).get("id")
          except Exception:
              pass
          if phid:
              call(f"https://graph.facebook.com/{V}/{phid}", {"method": "DELETE", "access_token": tok})
              print("    phantom created+deleted -> CREATE PERMISSION OK")
          else:
              print("    !! PHANTOM REFUSED - this is the wall")

          # 2. the exact same call publish.py makes (photo + caption)
          print("\n### 2. TEXT POST (the graph_post_text path)")
          c, b = call(f"https://graph.facebook.com/{V}/{PID}/feed", {
              "message": "azad-graph-probe text", "stream_visibility": "PUBLIC",
              "access_token": tok})
          print("    ->", c, b[:300])
          tid = None
          try:
              tid = json.loads(b).get("id")
          except Exception:
              pass
          if tid:
              print("    REAL POST ID:", tid)
              print("    https://www.facebook.com/" + tid)

          # 3. re-derive the page token from the refresh token and retry
          print("\n### 3. RE-DERIVED PAGE TOKEN (from FB_REFRESH_TOKEN)")
          ll = os.environ.get("FB_REFRESH_TOKEN", "").strip()
          c, b = call(f"https://graph.facebook.com/{V}/oauth/access_token?grant_type=fb_exchange_token"
                      f"&client_id={AID}&client_secret={urllib.parse.quote(SEC)}"
                      f"&fb_exchange_token={urllib.parse.quote(ll)}")
          LL = ""
          try:
              LL = json.loads(b).get("access_token", "")
          except Exception:
              pass
          print("    long-lived ->", c, "len", len(LL))
          if LL:
              c, b = call(f"https://graph.facebook.com/{V}/me/accounts?access_token=" + urllib.parse.quote(LL))
              try:
                  pages = json.loads(b).get("data", [])
              except Exception:
                  pages = []
              for p in pages:
                  print("    page:", p.get("id"), p.get("name"), "tok_len", len(p.get("access_token", "")))
              pt = next((p.get("access_token") for p in pages if str(p.get("id")) == PID), "")
              if pt:
                  c, b = call(f"https://graph.facebook.com/{V}/{PID}/feed", {
                      "message": "azad-graph-probe re-derived", "stream_visibility": "PUBLIC",
                      "access_token": pt})
                  print("    re-derived post ->", c, b[:300])
                  try:
                      rid = json.loads(b).get("id")
                      if rid:
                          print("    REAL POST ID (re-derived):", rid)
                          print("    https://www.facebook.com/" + rid)
                  except Exception:
                      pass

          print("\n### VERDICT")
          print("  if section 1 was refused, the token lacks create permission")
          print("  or the app needs Advanced Access for pages_manage_posts.")
          PY

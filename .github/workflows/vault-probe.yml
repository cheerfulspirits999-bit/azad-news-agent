name: vault-probe
on:
  workflow_dispatch: {}
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      TOK: ${{ secrets.FB_PAGE_TOKEN }}
      PID: ${{ secrets.FB_PAGE_ID }}
      SUT: ${{ secrets.FB_SU_TOKEN }}
      REFRESH: ${{ secrets.FB_REFRESH_TOKEN }}
    steps:
      - name: probe
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          def g(url, tok):
              try:
                  with urllib.request.urlopen(url + "&access_token=" + tok, timeout=25) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"_err": e.code, "_body": e.read()[:200].decode(errors="ignore")}
          pt = os.environ["TOK"]
          pid = os.environ["PID"]
          su = os.environ["SUT"]
          ref = os.environ.get("REFRESH", "")
          d = g("https://graph.facebook.com/v21.0/debug_token?input_token=" + pt + "&access_token=" + su, "")
          dd = d.get("data", {})
          print("VAULT-PAGE: valid=", dd.get("is_valid"), "type=", dd.get("type"), "expires=", dd.get("expires_at"), "err=", (json.dumps(d)[:150] if "data" not in d else ""))
          f = g("https://graph.facebook.com/v21.0/" + pid + "/feed?limit=1&fields=id,created_time", pt)
          print("VAULT-FEED:", json.dumps(f, ensure_ascii=False)[:180])
          r2 = g("https://graph.facebook.com/v21.0/debug_token?input_token=" + ref + "&access_token=" + su, "")
          rd = r2.get("data", {})
          print("REFRESH-TOK: valid=", rd.get("is_valid"), "type=", rd.get("type"), "err=", (json.dumps(r2)[:150] if "data" not in r2 else ""))
          ap = g("https://graph.facebook.com/v21.0/me/assigned_pages?fields=id,name&limit=5", su)
          print("SU-PAGES:", json.dumps(ap, ensure_ascii=False)[:280])
          ig = g("https://graph.facebook.com/v21.0/" + pid + "?fields=instagram_business_account", pt)
          print("PAGE-IG:", json.dumps(ig, ensure_ascii=False)[:280])
          PY

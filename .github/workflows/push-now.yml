name: push-now
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -q
      - name: forced card 1
        continue-on-error: true
        env:
          DIGEST_FORCE: 1
          IG_DUALPOST: ${{ vars.IG_DUALPOST }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_REFRESH_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
          RU_PROVIDER: ${{ vars.RU_PROVIDER }}
          RU_MODEL: ${{ vars.RU_MODEL }}
          RU_BASE_URL: ${{ vars.RU_BASE_URL }}
          RU_TIMEOUT: 40
          RU_DAILY_CAP: 200
          RU_DAILY_HARD: 220
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_KETS }}
        run: python3 news_agent/autod.py --once
      - name: forced card 2
        continue-on-error: true
        env:
          DIGEST_FORCE: 1
          IG_DUALPOST: ${{ vars.IG_DUALPOST }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_REFRESH_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
          RU_PROVIDER: ${{ vars.RU_PROVIDER }}
          RU_MODEL: ${{ vars.RU_MODEL }}
          RU_BASE_URL: ${{ vars.RU_BASE_URL }}
          RU_TIMEOUT: 40
          RU_DAILY_CAP: 200
          RU_DAILY_HARD: 220
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_KETS }}
        run: python3 news_agent/autod.py --once
      - name: commit memory
        if: always()
        run: |
          git config user.name "azad-news-agent"
          git config user.email "agent@localhost"
          git add news_agent/state news_agent/stories
          if ! git diff --cached --quiet; then
            git commit -m "push-now $(date -u +%FT%TZ)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || true
          fi

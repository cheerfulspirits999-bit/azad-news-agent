name: mint-token
on:
  workflow_dispatch:
    inputs:
      token:
        description: "Facebook USER token to exchange for a Page token (leave empty to use the TOKEN_TMP secret)"
        required: false
        default: ""
permissions:
  contents: read
  actions: write
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pynacl -q
      - name: mint + capability-check + store
        continue-on-error: true
        env:
          TOK: ${{ github.event.inputs.token || secrets.TOKEN_TMP }}
          PID: "1538679366414544"
          AID: ${{ secrets.FACEBOOK_APP_ID }}
          SEC: ${{ secrets.FB_APP_SECRET }}
          GH: ${{ secrets.AGENT_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.parse, urllib.error
          TOK = os.environ["TOK"].strip()
          # 3 Oct: an unquoted numeric env value reaches the runner as a FLOAT
          # ("1.53867936641454E+15"), so PID never equalled the page id.
          _pid_raw = os.environ["PID"].strip()
          PID = str(int(float(_pid_raw))) if _pid_raw.replace(".", "", 1).isdigit() else _pid_raw
          AID = os.environ["AID"].strip()
          SEC = os.environ["SEC"].strip()
          GH = os.environ["GH"].strip()
          REPO = os.environ["REPO"].strip()
          def call(url, data=None, method=None):
              qd = urllib.parse.urlencode(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=qd, method=method or ("POST" if data else "GET"))
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"_err": e.code, "_body": e.read()[:300].decode(errors="ignore")}
              except Exception as e:
                  return {"_exc": str(e)[:200]}
          APP = AID + "|" + SEC
          def scopes_of(dd):
              s = dd.get("scopes", [])
              return ",".join(s.get("data", []) if isinstance(s, dict) else s or [])
          d = call("https://graph.facebook.com/v21.0/debug_token?input_token=" + urllib.parse.quote(TOK) + "&access_token=" + urllib.parse.quote(APP))
          dd = d.get("data", {})
          print("MINT user-token valid=", dd.get("is_valid"), "expires=", dd.get("expires_at"), "scopes=", scopes_of(dd))
          ll = call("https://graph.facebook.com/v21.0/oauth/access_token?grant_type=fb_exchange_token&client_id=" + AID + "&client_secret=" + urllib.parse.quote(SEC) + "&fb_exchange_token=" + urllib.parse.quote(TOK))
          LL = (ll.get("access_token") or "").strip()
          print("MINT longlived:", ("OK len=" + str(len(LL))) if LL else json.dumps(ll)[:220])
          PT = ""
          if LL:
              acc = call("https://graph.facebook.com/v21.0/me/accounts?access_token=" + urllib.parse.quote(LL))
              for p in acc.get("data", []):
                  # 3 Oct: Graph returns the page `id` as an INTEGER, so
                  # `p.get("id") == PID` (a string) never matched and a
                  # perfectly valid token was reported "page-token: ABSENT".
                  if str(p.get("id")) == PID:
                      PT = p.get("access_token", "").strip()
              if PT:
                  print("MINT page-token: OK len=" + str(len(PT)))
              else:
                  print("MINT page-token: ABSENT  wanted pid=" + PID)
                  print("MINT pages: " + json.dumps([
                      {"id": p.get("id"), "idtype": type(p.get("id")).__name__,
                       "id_str": str(p.get("id")), "name": p.get("name"),
                       "tok": len(p.get("access_token", ""))}
                      for p in acc.get("data", [])]))
                  print("MINT raw: " + json.dumps(acc)[:600])
                  print("MINT err: " + json.dumps({k: v for k, v in acc.items() if k != "data"})[:300])
              if PT:
                  dbg = call("https://graph.facebook.com/v21.0/debug_token?input_token=" + urllib.parse.quote(PT) + "&access_token=" + urllib.parse.quote(APP))
                  if dbg.get("data"):
                      print("MINT PT scopes=", scopes_of(dbg["data"]))
          ok = False
          if PT:
              ph = call("https://graph.facebook.com/v21.0/" + PID + "/feed", {"message": "phantom-capability-check", "published": "false", "access_token": PT})
              pid = ph.get("id")
              if pid:
                  call("https://graph.facebook.com/v21.0/" + pid, {"method": "DELETE", "access_token": PT})
                  print("MINT capability: CAN PUBLISH (phantom created+deleted)")
                  ok = True
              else:
                  print("MINT capability: REFUSED", json.dumps(ph)[:240])
          if ok:
              def gh(url, data=None, method=None):
                  req = urllib.request.Request("https://api.github.com" + url,
                      data=json.dumps(data).encode() if data else None, method=method or ("POST" if data else "GET"),
                      headers={"Authorization": "Bearer " + GH, "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      b = r.read()
                  return json.loads(b) if b.strip() else {}
              pk = gh("/repos/" + REPO + "/actions/secrets/public-key")
              from nacl.public import PublicKey, SealedBox
              box = SealedBox(PublicKey(base64.b64decode(pk["key"])))
              for name, val in [("FB_PAGE_TOKEN", PT), ("FB_REFRESH_TOKEN", LL)]:
                  gh("/repos/" + REPO + "/actions/secrets/" + name,
                     {"key_id": pk["key_id"], "encrypted_value": base64.b64encode(box.encrypt(val.encode())).decode()}, "PUT")
                  print("STORED", name)
              print("MINT RESULT: STORED - publishing credential replaced with capability-checked page token")
          else:
              print("MINT RESULT: NOT-STORED - vault untouched; see reason above")
          PY

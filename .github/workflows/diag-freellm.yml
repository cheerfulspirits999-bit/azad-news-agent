name: diag-freellm
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Roman Urdu from the live Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          GK = os.environ["GEMINI_API_KEY"]
          r = urllib.request.urlopen(
              "https://generativelanguage.googleapis.com/v1beta/models?key=" + GK, timeout=40)
          names = [m["name"].replace("models/", "")
                   for m in json.loads(r.read().decode())["models"]
                   if "generateContent" in (m.get("supportedGenerationMethods") or [])]
          print("ALL FLASH MODELS:")
          for n in names:
              if "flash" in n and "tts" not in n and "image" not in n:
                  print("   ", n)
          PROMPT = ("Translate the English news sentences into Roman Urdu (Urdu in "
                    "English letters, Hyderabad style). Keep proper nouns in English. "
                    "Return ONLY the translations, one per line, numbered.\n"
                    "1. Police arrested two men in Hyderabad after a raid on a hotel.\n"
                    "2. Shubman Gill became the first Indian to 3000 WTC runs.\n"
                    "3. A person was held with live ammunition at RGIA, police said.")
          def gen(model, timeout=120):
              url = ("https://generativelanguage.googleapis.com/v1beta/models/"
                     + model + ":generateContent?key=" + GK)
              data = json.dumps({"contents": [{"parts": [{"text": PROMPT}]}],
                                 "generationConfig": {"temperature": 0.2,
                                                      "maxOutputTokens": 400}}).encode()
              req = urllib.request.Request(url, data=data)
              req.add_header("Content-Type", "application/json")
              try:
                  rr = urllib.request.urlopen(req, timeout=timeout)
                  d = json.loads(rr.read().decode("utf-8", "replace"))
                  c = d["candidates"][0]
                  txt = "".join(p.get("text", "") for p in c["content"]["parts"]).strip()
                  return 200, txt
              except urllib.error.HTTPError as e:
                  return e.code, e.read(220).decode("utf-8", "replace")
              except Exception as e:
                  return 0, str(e)[:130]
          for mdl in ("gemini-3.8-flash", "gemini-3-flash-preview",
                      "gemini-flash-latest", "gemini-flash-lite-latest",
                      "gemini-3.1-flash-lite-preview"):
              s, out = gen(mdl)
              print("=== %s -> HTTP %s" % (mdl, s))
              for line in out.splitlines()[:6]:
                  print("     ", line[:150])
          PY

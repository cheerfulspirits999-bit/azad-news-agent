name: diag-freellm
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
      RU_PROVIDER: ${{ vars.RU_PROVIDER }}
      RU_MODEL: ${{ vars.RU_MODEL }}
      RU_BASE_URL: ${{ vars.RU_BASE_URL }}
      RU_TIMEOUT: 40
      RU_DAILY_CAP: 200
      RU_DAILY_HARD: 220
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Rank the live Gemini family through the real engine
        run: |
          python3 - <<'PY'
          import os, sys, time
          sys.path.insert(0, "news_agent")
          import roman_urdu as ru
          K = os.environ["GEMINI_API_KEY"]
          B = ["A person was held with live ammunition at RGIA, police said.",
               "Housefly, cockroach infestations found in raids at 9 Hyderabad hotels.",
               "MBBS students have begun a strike in Karimnagar.",
               "Two people died after a lorry hit a car on the Outer Ring Road."]
          CAND = ["gemini-flash-lite-latest", "gemini-3.1-flash-lite",
                  "gemini-3.1-flash-lite-preview", "gemini-3.5-flash-lite",
                  "gemini-3-flash-preview", "gemini-3.6-flash",
                  "gemini-omni-1.2-flash", "gemini-3.8-flash"]
          for m in CAND:
              t0 = time.time()
              try:
                  out = ru.translate_lines(list(B), provider="gemini", model=m,
                                           api_key=K, use_few_shot=False)
              except Exception as e:
                  print("%-32s EXC %.1fs %s" % (m, time.time() - t0, str(e)[:90]))
                  sys.stdout.flush(); continue
              dt = time.time() - t0
              meth = out.get("method") if isinstance(out, dict) else "list"
              lines = (out.get("lines") or out.get("translations") or []) \
                      if isinstance(out, dict) else out
              print("%-32s %-9s %5.1fs" % (m, meth, dt))
              if meth == "llm":
                  for t in lines:
                      print("        >", str(t)[:125])
              sys.stdout.flush()
          PY

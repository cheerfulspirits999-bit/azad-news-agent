name: diag-freellm
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Current Gemini models and their Roman Urdu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          GK = os.environ["GEMINI_API_KEY"]
          RK = os.environ.get("RU_API_KEY") or ""
          def get(url, timeout=40):
              try:
                  r = urllib.request.urlopen(url, timeout=timeout)
                  return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(300).decode("utf-8", "replace")
              except Exception as e:
                  return 0, str(e)[:120]
          s, b = get("https://generativelanguage.googleapis.com/v1beta/models?key=" + GK)
          names = []
          if s == 200:
              for m in json.loads(b).get("models", []):
                  n = m.get("name", "").replace("models/", "")
                  if "generateContent" in (m.get("supportedGenerationMethods") or []):
                      names.append(n)
              print("GEMINI MODELS:", len(names))
              print("  flash-ish:", [n for n in names if "flash" in n][:14])
          else:
              print("list HTTP", s, b[:200])
          PROMPT = ("Translate this English news sentence into Roman Urdu (Urdu "
                    "written in English letters, as spoken in Hyderabad India). "
                    "Reply with ONLY the translation.\nSentence: Police arrested "
                    "two men in Hyderabad after a raid on a hotel on Friday.")
          def gen(model):
              url = ("https://generativelanguage.googleapis.com/v1beta/models/"
                     + model + ":generateContent?key=" + GK)
              data = json.dumps({"contents": [{"parts": [{"text": PROMPT}]}],
                                 "generationConfig": {"temperature": 0.2,
                                                      "maxOutputTokens": 200}}).encode()
              req = urllib.request.Request(url, data=data)
              req.add_header("Content-Type", "application/json")
              try:
                  r = urllib.request.urlopen(req, timeout=70)
                  d = json.loads(r.read().decode("utf-8", "replace"))
                  return 200, d["candidates"][0]["content"]["parts"][0]["text"].strip()
              except urllib.error.HTTPError as e:
                  return e.code, e.read(200).decode("utf-8", "replace")
              except Exception as e:
                  return 0, str(e)[:150]
          prefer = [n for n in ("gemini-flash-latest", "gemini-2.5-flash",
                                "gemini-2.5-flash-lite", "gemini-2.0-flash-001",
                                "gemini-pro-latest") if n in names] or names[:3]
          for mdl in prefer[:5]:
              s, out = gen(mdl)
              print("GEM %-26s HTTP %s  %s" % (mdl, s, out[:170].replace("\n", " ")))
          # what free slugs does OpenRouter still serve?
          s, b = get("https://openrouter.ai/api/v1/models")
          if s == 200:
              free = [m["id"] for m in json.loads(b).get("data", [])
                      if m["id"].endswith(":free")]
              print("OPENROUTER FREE SLUGS:", len(free))
              print("  sample:", free[:12])
          PY

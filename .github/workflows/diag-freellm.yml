name: diag-freellm
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
      RU_PROVIDER: ${{ vars.RU_PROVIDER }}
      RU_MODEL: ${{ vars.RU_MODEL }}
      RU_BASE_URL: ${{ vars.RU_BASE_URL }}
      RU_TIMEOUT: 40
      RU_DAILY_CAP: 200
      RU_DAILY_HARD: 220
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_KETS }}
    steps:
      - uses: actions/checkout@v4
      - name: Exercise the REAL engine, lane by lane
        run: |
          python3 - <<'PY'
          import os, sys, importlib
          sys.path.insert(0, "news_agent")
          import roman_urdu as ru
          print("ENGINE        :", ru.ENGINE)
          print("configured()  :", ru.configured())
          eng = sys.modules.get("roman_urdu_translator_engine")
          print("DEFAULT_PROV  :", getattr(eng, "DEFAULT_PROVIDER", "?"))
          print("RU_MODEL env  :", os.environ.get("RU_MODEL"))
          print("RU_BASE_URL   :", os.environ.get("RU_BASE_URL"))
          for k, v in getattr(eng, "API_KEYS", {}).items():
              print("   API_KEYS[%-9s] len=%s" % (k, len(v or "")))
          import autod
          print("autod._ru_on():", autod._ru_on())
          lanes = list(autod._ru_attempts())
          print("LANES (%d):" % len(lanes))
          for lbl, kw in lanes:
              print("   %-42s prov=%-8s key=%s" % (
                  lbl, kw.get("provider", "(RU_PROVIDER)"), len(kw.get("api_key", "") or "")))
          BULLETS = ["A person was held with live ammunition at RGIA, police said.",
                     "Housefly, cockroach infestations found in raids at 9 Hyderabad hotels.",
                     "MBBS students have begun a strike in Karimnagar."]
          for lbl, kw in lanes:
              sys.stdout.flush()
              try:
                  out = ru.translate_lines(list(BULLETS), **kw)
              except Exception as e:
                  print("LANE %-40s EXC %s" % (lbl, str(e)[:110])); continue
              if isinstance(out, dict):
                  lines = out.get("lines") or out.get("translations") or []
                  print("LANE %-40s method=%s" % (lbl, out.get("method")))
              else:
                  lines = out
                  print("LANE %-40s (list)" % lbl)
              for b, t in zip(BULLETS, lines or []):
                  print("      >", str(t)[:130])
          PY

name: heal
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
jobs:
  h:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pynacl -q
      - name: link probe + mint + prove + store
        continue-on-error: true
        env:
          SUT: ${{ secrets.FB_SU_TOKEN }}
          PID: ${{ secrets.FB_PAGE_ID }}
          AID: ${{ secrets.FACEBOOK_APP_ID }}
          SEC: ${{ secrets.FB_APP_SECRET }}
          GH: ${{ secrets.AGENT_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.parse, urllib.error
          SUT = os.environ["SUT"].strip()
          PID = os.environ["PID"].strip()
          AID = os.environ["AID"].strip()
          SEC = os.environ["SEC"].strip()
          GH = os.environ["GH"].strip()
          REPO = os.environ["REPO"].strip()
          APP = AID + "|" + SEC
          BID = "122180291947298"
          SUID = "122095644171503362"
          def call(url, data=None, method=None):
              qd = urllib.parse.urlencode(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=qd, method=method or ("POST" if data else "GET"))
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"_err": e.code, "_body": e.read()[:220].decode(errors="ignore")}
              except Exception as e:
                  return {"_exc": str(e)[:150]}
          PT = ""
          b = call("https://graph.facebook.com/v21.0/" + BID + "?fields=name&access_token=" + urllib.parse.quote(APP))
          print("HL LINK-PROBE:", json.dumps(b)[:170])
          if b.get("name"):
              r2 = call("https://graph.facebook.com/v21.0/" + BID + "/access_tokens",
                        {"system_user_id": SUID, "asset_id": PID, "asset_type": "PAGE",
                         "permitted_function": "MANAGE", "access_token": APP})
              print("HL MINT:", json.dumps(r2)[:160])
              PT = r2.get("access_token", "")
          if not PT:
              acc = call("https://graph.facebook.com/v21.0/me/accounts?fields=id,access_token&access_token=" + urllib.parse.quote(SUT))
              for p in acc.get("data", []):
                  if p.get("id") == PID and p.get("access_token"):
                      PT = p["access_token"]
              if not PT:
                  print("HL ACCOUNTS:", json.dumps(acc)[:200])
          if PT:
              ph = call("https://graph.facebook.com/v21.0/" + PID + "/feed", {"message": "phantom", "published": "false", "access_token": PT})
              print("HL PHANTOM:", json.dumps(ph)[:150])
              if ph.get("id"):
                  call("https://graph.facebook.com/v21.0/" + ph["id"], {"method": "DELETE", "access_token": PT})
                  def gh(url, data=None, method=None):
                      req = urllib.request.Request("https://api.github.com" + url,
                          data=json.dumps(data).encode() if data else None, method=method or ("POST" if data else "GET"),
                          headers={"Authorization": "Bearer " + GH, "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
                      with urllib.request.urlopen(req, timeout=30) as r3:
                          b3 = r3.read()
                      return json.loads(b3) if b3.strip() else {}
                  pk = gh("/repos/" + REPO + "/actions/secrets/public-key")
                  from nacl.public import PublicKey, SealedBox
                  box = SealedBox(PublicKey(base64.b64decode(pk["key"])))
                  gh("/repos/" + REPO + "/actions/secrets/FB_PAGE_TOKEN",
                     {"key_id": pk["key_id"], "encrypted_value": base64.b64encode(box.encrypt(PT.encode())).decode()}, "PUT")
                  print("HL RESULT: HEALED - capability-proved permanent token stored in vault")
              else:
                  print("HL RESULT: minted but publish refused:", json.dumps(ph)[:150])
          else:
              print("HL RESULT: NOT-HEALED - link or mint still blocked")
          PY

# Forced multi-card push - 3 Oct.
#
# Owner: "Post more news, since morning no post - you posted one card 45 min
# before." The digest gate (_due = gap_min >= 55) had closed 31 minutes after the
# last card, so the relay was correctly holding. DIGEST_FORCE=1 is the owner's
# documented manual-push override (2 Oct) and bypasses that gate.
#
# Every step runs `autod.py --once` in the SAME job so the steps share the
# runner's working directory: each card writes published.json to disk before the
# next step starts, so the digest builder's disk-based dedupe picks FRESH
# stories instead of repeating the same headlines. No spacing rule applies to the
# digest path (only the 55-min gate, which DIGEST_FORCE overrides).
#
# DIGEST_CATCHUP=1 also raises the daily card cap from 24 to 30 for this drain.
name: azad-push
on:
  workflow_dispatch:
    inputs:
      cards:
        description: "how many forced digest cards to push"
        required: false
        default: "4"
permissions: { contents: write }
concurrency:
  # 26 Oct owner: shared with the relay so a manual push can never publish on
  # top of a relay card. cancel-in-progress: true means the owner's button wins
  # the slot immediately instead of queueing behind a whole hour of cycles.
  group: azad-daily-publish
  cancel-in-progress: true
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IG_DUALPOST: "0"
      DIGEST_FORCE: "1"
      DIGEST_CATCHUP: "1"
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FB_REFRESH_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
      RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
      RU_PROVIDER: ${{ vars.RU_PROVIDER }}
      RU_MODEL: ${{ vars.RU_MODEL }}
      RU_BASE_URL: ${{ vars.RU_BASE_URL }}
      RU_TIMEOUT: 40
      RU_DAILY_CAP: 200
      RU_DAILY_HARD: 220
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_KETS }}
      # 6 Oct (owner: "i am adding pixabay api also for free photos"): free
      # stock art for digest stories whose feed carried no image. Optional -
      # with the secret absent cardphoto resolves no photo and the card is
      # exactly the card it always was. Add the secret and it starts working
      # with no code change.
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      # 6 Oct (owner: "not random imade added to all the cards"): stock art is
      # OFF by default. A card carries the news story's OWN photo or no photo -
      # a random stock picture on a news card misleads the reader. Flip this to
      # "1" only if you want Pixabay art when a feed carried none.
      CARD_PIXABAY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt -q

      # 26 Oct owner: "stop posting you posted so many cards" + "set the cycle
      # to hourly". This button used to run four forced cycles back to back, so
      # one press dumped up to five cards on the page in 40 minutes. It now runs
      # ONE cycle: the gate inside autod.py still enforces the 55-minute hourly
      # floor, so a press inside the hour correctly does nothing and the report
      # step below says exactly why.
      - name: one hourly card
        continue-on-error: true
        run: python3 news_agent/autod.py --once
      - name: retry anything still queued
        continue-on-error: true
        run: python3 news_agent/autod.py --once

      - name: report what actually posted
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = os.path.join("news_agent", "state", "published.json")
          try:
              rows = json.load(open(p, encoding="utf-8"))
          except Exception as e:
              print("no published.json:", e); raise SystemExit
          print(f"published.json entries: {len(rows)}")
          for r in rows[-6:]:
              print(f"  {r.get('published_at','?')[:19]}  "
                    f"fb={r.get('fb_post_id')}  ig={r.get('ig_post_id')}  "
                    f"{(r.get('title') or '')[:60]}")
          pend = os.path.join("news_agent", "state", "pending_publish.json")
          try:
              q = json.load(open(pend, encoding="utf-8"))
              print(f"still pending: {len(q)}")
          except Exception:
              print("still pending: 0")
          PY

      # 26 Oct: a manual push can cancel the relay mid-hour (shared concurrency
      # group). This step puts the hourly chain back on its feet, so pressing
      # the button never costs the page its cadence.
      - name: relay handoff - resume the hourly chain
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.error
          TOK = os.environ["GH_TOKEN"]
          REPO = os.environ["REPO"]
          SELF = os.environ.get("RUN_ID", "")
          API = f"https://api.github.com/repos/{REPO}"
          HDR = {"Authorization": "Bearer " + TOK,
                 "Accept": "application/vnd.github+json"}

          def _runs(status):
              req = urllib.request.Request(
                  f"{API}/actions/runs?per_page=30&status={status}", headers=HDR)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read()).get("workflow_runs", [])
              except Exception as e:
                  print("run list failed:", e)
                  return []

          # 26 Oct: with a shared concurrency group a fresh dispatch would
          # CANCEL whatever is already running - so if the owner's push is in
          # flight, stand down and let IT hand off instead. Whichever run
          # finishes last queues the next relay, so the hourly chain never dies.
          # The run executing THIS step is itself in progress, so it has to be
          # excluded - otherwise the guard always sees "another relay" and never
          # queues a successor, which kills the self-driving chain and leaves
          # only the cron (it fires with hours of jitter: a 4-hour hole opened
          # at 18:56Z on 26 Oct because of exactly this).
          busy = [r for r in _runs("in_progress") + _runs("queued")
                  if r.get("name") == "azad-relay" and str(r.get("id")) != SELF]
          if busy:
              print(f"another azad-relay run is already {busy[0].get('status')} "
                    f"- not queueing a duplicate; it will hand off itself")
          else:
              url = f"{API}/actions/workflows/azad-relay.yml/dispatches"
              for attempt in range(8):
                  req = urllib.request.Request(
                      url, data=json.dumps({"ref": "main"}).encode(), headers=HDR)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          print(f"successor queued (HTTP {r.status}) - cadence continues")
                          break
                  except urllib.error.HTTPError as e:
                      print(f"handoff attempt {attempt}: HTTP {e.code} "
                            f"{e.read().decode()[:160]}")
                      time.sleep(10 * (attempt + 1))
              else:
                  print("HANDOFF FAILED - relying on the cron backup trigger")
          PY

      - name: commit memory
        if: always()
        run: |
          git config user.name "azad-news-agent"
          git config user.email "agent@localhost"
          # 6 Oct: same swallowed-rebase bug as the relay. commit_state.py
          # unions published.json instead of letting the rebase conflict, so a
          # posted card is always recorded and can never be published twice.
          COMMIT_MSG="push $(date -u +%FT%TZ)" \
            python3 news_agent/commit_state.py || echo "commit step failed"

name: fb-visibility-audit
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: compare signing apps across the 27th
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          PT = os.environ.get("FB_PAGE_TOKEN", "")
          G = "https://graph.facebook.com/v21.0/"
          def get(u):
              try:
                  with urllib.request.urlopen(u, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"__error": e.code, "body": e.read().decode()[:220]}
          posts = [("sep26-visible?", "1538679366414544_1655293676157443"),
                   ("sep27-am", "1538679366414544_1655908446095966"),
                   ("sep28-night", "1538679366414544_1657243039295840"),
                   ("sep29-0005", "1538679366414544_1657353759284768")]
          for label, pid in posts:
              d = get(f"{G}{pid}?fields=id,created_time,app,share_count,"
                      f"comment_count,permalink_url&access_token={PT}")
              app = d.get("app") or {}
              print(label, "|", d.get("created_time", "?"),
                    "| app:", app.get("name"), app.get("id"),
                    "| shares:", d.get("share_count"), "| comments:", d.get("comment_count"))
              if "__error" in d:
                  print("   err:", d["body"][:160])
          PY

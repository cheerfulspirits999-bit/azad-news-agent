name: fb-visibility-audit
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FB_REFRESH_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: self truth
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          G = "https://graph.facebook.com/v21.0/"
          PT = os.environ.get("FB_PAGE_TOKEN", "")
          U = os.environ.get("FB_REFRESH_TOKEN", "")
          PAGE = os.environ.get("FB_PAGE_ID", "")
          def get(u):
              try:
                  with urllib.request.urlopen(u, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"__error": e.code, "body": e.read().decode()[:180]}
          def post(u, data):
              req = urllib.request.Request(u, data=urllib.parse.urlencode(data).encode(),
                                           method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"__error": e.code, "body": e.read().decode()[:180]}
          for label, tok in [("PAGE-TOKEN self-debug", PT),
                             ("USER-TOKEN self-debug", U)]:
              d = get(f"{G}debug_token?input_token={tok}&access_token={tok}").get("data", {})
              print(label, "-> app:", d.get("app_id"), "| valid:", d.get("is_valid"),
                    "| id:", d.get("id"), "| scopes:", d.get("scopes"))
          f = get(f"{G}{PAGE}/published_posts?limit=10&fields=id,created_time,message"
                  f"&access_token={PT}")
          for q in (f.get("data") or []):
              m = (q.get("message") or "").strip()
              if m.startswith("🔧"):
                  r = post(f"{G}{q['id']}", {"method": "DELETE", "access_token": PT})
                  print("deleted labeled note", q["id"][-14:], "->", json.dumps(r)[:60])
          print("cleanup pass done")
          PY

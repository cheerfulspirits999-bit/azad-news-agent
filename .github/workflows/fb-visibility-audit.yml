name: fb-visibility-audit
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_USER_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: definitive public-visibility test post
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          PAGE = os.environ.get("FB_PAGE_ID", "")
          PT = os.environ.get("FB_PAGE_TOKEN", "")
          def api(url, data=None):
              u = "https://graph.facebook.com/v21.0/" + url
              body = urllib.parse.urlencode(data).encode() if data else None
              if data:
                  body += b"&access_token=" + PT.encode()
              else:
                  u += "&access_token=" + PT
              req = urllib.request.Request(u, data=body, method="POST" if data else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"__error": e.code, "body": e.read().decode()[:250]}
          msg = ("🔧 PUBLIC-VISIBILITY TEST (auto-posted, will be removed soon)\n\n"
                 "If you are reading this on Azad Daily from a phone that is NOT the page "
                 "admin - our publishing IS public and everything is fine. If only the admin "
                 "can see posts like this, Meta requires the app approval step (1 dashboard action).")
          r = api(f"{PAGE}/feed", {"message": msg})
          if "id" not in r:
              print("publish failed:", json.dumps(r)[:300]); raise SystemExit(1)
          pid = r["id"]
          print("test post published:", pid)
          chk = api(f"{pid}?fields=id,is_hidden,permalink_url,expires_at,created_time")
          print("post state:", json.dumps(chk, default=str)[:400])
          PY

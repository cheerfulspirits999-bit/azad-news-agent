name: fb-visibility-audit
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_USER_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: final publish-state probe
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          PAGE = os.environ.get("FB_PAGE_ID", "")
          PT = os.environ.get("FB_PAGE_TOKEN", "")
          def api(url, tok):
              sep = "&" if "?" in url else "?"
              req = urllib.request.Request("https://graph.facebook.com" + url + sep + "access_token=" + tok)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"__error": e.code, "body": e.read().decode()[:250]}
          print("== PAGE publish state ==")
          print(json.dumps(api(f"/v21.0/{PAGE}?fields=name,is_published,link,fan_count,"
                               "verification_status,about", PT), indent=1)[:500])
          print("== one card permalink via published_posts ==")
          f = api(f"/v21.0/{PAGE}/published_posts?limit=1&fields=id,permalink_url,"
                  "created_time,is_shared_to_feed,stream_visibility", PT)
          d = f.get("data") or [{}]
          for k in ("id", "permalink_url", "stream_visibility", "is_shared_to_feed"):
              print(f"  {k}:", d[0].get(k, "?"))
          PY

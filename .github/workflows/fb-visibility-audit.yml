name: fb-visibility-audit
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_USER_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: published_posts expiry + violations probe
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          PAGE = os.environ.get("FB_PAGE_ID", "")
          PT = os.environ.get("FB_PAGE_TOKEN", "")
          def api(url, tok):
              sep = "&" if "?" in url else "?"
              req = urllib.request.Request("https://graph.facebook.com" + url + sep + "access_token=" + tok)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"__error": e.code, "body": e.read().decode()[:350]}
          print("== PUBLISHED_POSTS (posts made by OUR app on this page) ==")
          f = api(f"/v21.0/{PAGE}/published_posts?limit=10&fields=id,created_time,"
                  "expires_at,status,is_hidden,permalink_url,message", PT)
          data = f.get("data")
          if data is None:
              print("published_posts:", json.dumps(f)[:420])
          else:
              for post in data:
                  m = (post.get("message") or "").replace("\n", " ")[:40]
                  print(f"  {post.get('created_time','')} exp={post.get('expires_at','NONE')} "
                        f"status={post.get('status','?')} hidden={post.get('is_hidden')} | {m}")
              print("== PERMISSIONS ON THE PAGE TOKEN ==")
          print("== PAGE VIOLATIONS / QUALITY ==")
          v = api(f"/v21.0/{PAGE}/violations", PT)
          print("violations:", json.dumps(v)[:300])
          print("== TOKEN SCOPES (via /me perm check) ==")
          s = api("/v21.0/me?fields=id,link,username", PT)
          print("me:", json.dumps(s)[:250])
          PY

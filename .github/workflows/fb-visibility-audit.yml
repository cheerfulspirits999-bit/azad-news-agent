name: fb-visibility-audit
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_USER_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: restrictions + visibility settings
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          PAGE = os.environ.get("FB_PAGE_ID", "")
          PT = os.environ.get("FB_PAGE_TOKEN", "")
          def api(url, tok):
              sep = "&" if "?" in url else "?"
              req = urllib.request.Request("https://graph.facebook.com" + url + sep + "access_token=" + tok)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"__error": e.code, "body": e.read().decode()[:250]}
          print("== PAGE SETTINGS (restrictions/age/maintenance) ==")
          ps = api(f"/v21.0/{PAGE}/page_settings", PT)
          data = ps.get("data")
          if data is None:
              print("page_settings:", json.dumps(ps)[:300])
          else:
              interesting = ("MAINTENANCE", "COUNTRY_RESTRICTEDNESS", "RESTRICTED_COUNTRIES",
                             "AGE", "MIN_AGE", "PUBLIC", "PUBLISHED", "PAGE_PROFILE_STATUS",
                             "PAGE_TASKS", "PAGE_PROFILE_VISIBILITY", "VISIBILITY")
              for row in data:
                  k = str(row.get("setting", ""))
                  if any(w in k.upper() for w in interesting):
                      print("  ", k, "=", json.dumps(row.get("value"))[:120])
          print("== PAGE core fields ==")
          c = api(f"/v21.0/{PAGE}?fields=name,is_published,link,age_min,"
                  "has_ad_access,page_upgrade_status,verification_status,status", PT)
          print(json.dumps(c, indent=1)[:700])
          PY

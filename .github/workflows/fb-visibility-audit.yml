name: fb-visibility-audit
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FB_REFRESH_TOKEN: ${{ secrets.FB_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: exact-text logged-out proof
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse, re
          G = "https://graph.facebook.com/v21.0/"
          PT = os.environ.get("FB_PAGE_TOKEN", "")
          PAGE = os.environ.get("FB_PAGE_ID", "")
          def graph(u):
              try:
                  with urllib.request.urlopen(u + ("&" if "?" in u else "?")
                        + "access_token=" + PT, timeout=40) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"__error": e.code, "body": e.read().decode()[:160]}
          def plain(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(
                      u, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64)"}), timeout=40)
                  return r.read().decode("utf-8", "replace")
              except Exception as e:
                  return "__plain_error " + str(e)
          def norm(t):
              return re.sub(r"\s+", " ", t).lower()
          f = graph(f"{G}{PAGE}/published_posts?limit=6&fields=id,created_time,message,permalink_url")
          posts = f.get("data") or []
          print("listed:", len(posts))
          for q in posts[:3]:
              msg = q.get("message") or ""
              frag = ""
              for ln in msg.splitlines()[1:]:
                  frag = re.sub(r"^[*\u2022\s]+", "", ln)[:46].strip()
                  if len(frag) > 18:
                      break
              href = q.get("permalink_url", "")
              html = plain("https://www.facebook.com/plugins/post.php?href="
                           + urllib.parse.quote(href, safe="") + "&show_text=true")
              hit = frag and norm(frag) in norm(html)
              print(q["created_time"], "| exact-bullet in logged-out render:",
                    ("YES" if hit else "NO"), "| frag:", frag[:40])
          html = plain("https://www.facebook.com/plugins/page.php?href="
                       + urllib.parse.quote("https://www.facebook.com/1657288895957921", safe="")
                       + "&tabs=timeline&width=500")
          first = norm((posts[0].get("message") or "").splitlines()[-1][:40]) if posts else ""
          print("timeline widget len:", len(html),
                "| latest-card-frag in timeline:",
                (first and first in norm(html)))
          print("proof pass done")
          PY

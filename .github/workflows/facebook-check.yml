name: facebook-check
on:
  schedule:
    - cron: "45 * * * *"   # hourly patrol (owner 26 Sep: 24/7)
  workflow_dispatch: {}                      # manual button stays
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps (pillow for publish imports)
        run: python3 -m pip install -q pillow
      - name: check Facebook Page connection (read-only)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python3 news_agent/publish.py --check-fb

      - name: slot watchdog - re-dispatch news cycle if GitHub dropped the slot
        if: always()
        env:
          PAT: ${{ secrets.AGENT_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          from datetime import datetime, timezone, timedelta
          pat = os.environ.get("PAT", "")
          if not pat:
              print("no AGENT_PAT secret; watchdog idle"); raise SystemExit
          repo = os.environ["REPO"]
          def api(url, data=None):
              req = urllib.request.Request(
                  url, data=json.dumps(data).encode() if data else None,
                  headers={"Authorization": "Bearer " + pat,
                           "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(req, timeout=30))
          IST = timezone(timedelta(hours=5))
          now = datetime.now(IST)
          q = api(f"https://api.github.com/repos/{repo}/contents/news_agent/state/quota.json?ref=main")
          quota = json.loads(base64.b64decode(q["content"]).decode())
          age = 9999
          if quota.get("last_card_at"):
              age = (now - datetime.fromisoformat(quota["last_card_at"])).total_seconds() / 60
          if age < 75:
              print(f"last card {age:.0f} min ago: hourly cadence healthy"); raise SystemExit
          runs = api(f"https://api.github.com/repos/{repo}/actions/workflows/news-cycle.yml/runs"
                     "?per_page=4")
          last_run_min = 9999.0
          for r in runs.get("workflow_runs", []):
              dmin = (now - datetime.fromisoformat(
                  r["created_at"].replace("Z", "+00:00")).astimezone(IST)).total_seconds() / 60
              last_run_min = min(last_run_min, dmin)
          if last_run_min < 30:
              print(f"news-cycle ran {last_run_min:.0f} min ago: fresh enough, skip")
              raise SystemExit
          if last_run_min < 75 and age < 3 * 60:
              print("cron gave a recent shot; one more cycle will follow - skip")
              raise SystemExit
          print(f"missed slot detected -> dispatching news-cycle now (age {age:.0f} min)")
          body = {"ref": "main"}
          if age >= 150:
              body["inputs"] = {"catchup": "1"}  # owner 25 Sep: drain the backlog
          api(f"https://api.github.com/repos/{repo}/actions/workflows/news-cycle.yml/dispatches",
              body)
          PY

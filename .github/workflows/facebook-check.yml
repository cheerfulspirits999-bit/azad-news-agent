name: facebook-check
on:
  workflow_dispatch:
  schedule:
    - cron: '5 3,15 * * *'   # 08:35 & 20:35 IST heartbeat of the FB connection
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: check Facebook Page connection (read-only)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python3 news_agent/publish.py --check-fb

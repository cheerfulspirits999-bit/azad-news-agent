# One-shot tidy + verify - 3 Oct.
#
# The graph-probe run made two throwaway test posts while proving the credential
# ("azad-graph-probe text" and "azad-graph-probe re-derived"). This deletes those
# two and reads back the REAL digest post to prove it is publicly visible.
name: tidy-probe
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: delete the probe posts, verify the real one
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          V = "v21.0"
          tok = os.environ["FB_PAGE_TOKEN"].strip()
          PID = os.environ.get("FB_PAGE_ID", "").strip() or "1538679366414544"

          def call(url, data=None):
              qd = urllib.parse.urlencode(data).encode() if data else None
              req = urllib.request.Request(url, data=qd,
                      method="POST" if data else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.code, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="ignore")

          # the two throwaway posts the probe created
          for pid in ["1662271065459704", "1662271112126366"]:
              full = PID + "_" + pid
              c, b = call(f"https://graph.facebook.com/{V}/{full}",
                          {"method": "DELETE", "access_token": tok})
              print(f"delete {full} -> {c} {b[:160]}")

          # the REAL digest post - prove it is public
          real = PID + "_1662268278793316"
          c, b = call(f"https://graph.facebook.com/{V}/{real}"
                      "?fields=id,message,is_hidden,permalink_url,created_time"
                      "&access_token=" + urllib.parse.quote(tok))
          print(f"\nread-back {real} -> {c}")
          try:
              d = json.loads(b)
              print("  is_hidden     :", d.get("is_hidden"))
              print("  permalink_url :", d.get("permalink_url"))
              print("  created_time  :", d.get("created_time"))
              msg = (d.get("message") or "")[:150].replace("\n", " | ")
              print("  message       :", msg)
          except Exception:
              print("  ", b[:300])
          PY

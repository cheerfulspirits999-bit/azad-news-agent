name: diag-translator
on:
  workflow_dispatch: {}
  schedule:
    # 00:05 UTC = 05:35 IST - the moment OpenRouter's 50-requests-per-day free
    # quota comes back. Probing here records whether the free lane is alive
    # BEFORE the relay spends the day's quota, so a starved digest always has
    # a written reason instead of a mystery.
    - cron: "5 0 * * *"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt -q
      - name: probe every translator lane (read-only, posts nothing)
        env:
          RU_API_KEY: ${{ secrets.ROMAN_URDU_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_KETS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RU_BASE_URL: ${{ vars.RU_BASE_URL }}
          RU_PROVIDER: ${{ vars.RU_PROVIDER }}
          RU_MODEL: ${{ vars.RU_MODEL }}
          RU_TIMEOUT: "30"
        run: |
          python3 - <<'PY'
          import os, sys, json, time, urllib.request, urllib.error
          sys.path.insert(0, "news_agent")
          import roman_urdu
          import roman_urdu_translator.roman_urdu as eng

          LINES = ["Telangana government approves a new data centre policy",
                   "Officials say the project will create five thousand jobs",
                   "The cabinet also cleared a single-window clearance system"]

          def mask(k):
              return f"set(len={len(k)})" if k else "MISSING"

          keys = {v: mask(os.environ.get(v, "")) for v in
                  ("RU_API_KEY", "GEMINI_API_KEY", "OPENAI_API_KEY", "GROQ_API_KEY")}
          print("=" * 68)
          print("KEYS PRESENT (values never printed)")
          print("=" * 68)
          for k, v in keys.items():
              print(f"  {k:16s} {v}")
          print(f"  openai endpoint {eng.ENDPOINTS['openai']}")

          res = {"at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                 "keys": keys, "endpoint": eng.ENDPOINTS["openai"], "lanes": {}}

          # ---- raw HTTP probe first: is the free quota even available? -----
          # If it is 429 we SKIP the engine call so this probe never burns a
          # request on a lane that is already known dead.
          print()
          print("=" * 68)
          print("RAW HTTP PROBE - OpenRouter :free model, real RU_API_KEY")
          print("=" * 68)
          body = json.dumps({
              "model": "nvidia/nemotron-3-ultra-550b-a55b:free",
              "messages": [{"role": "user", "content": "Reply with the single word OK"}],
              "max_tokens": 8}).encode()
          req = urllib.request.Request(
              eng.ENDPOINTS["openai"], data=body, method="POST",
              headers={"Authorization": "Bearer " + os.environ.get("RU_API_KEY", ""),
                       "Content-Type": "application/json"})
          raw_status, raw_body = None, ""
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw_status, raw_body = r.status, r.read()[:300].decode("utf8", "replace")
                  print(f"  HTTP {raw_status}: {raw_body}")
          except urllib.error.HTTPError as e:
              raw_status, raw_body = e.code, e.read()[:300].decode("utf8", "replace")
              print(f"  HTTP {e.code}: {raw_body}")
          except Exception as e:
              raw_status, raw_body = "ERR", f"{type(e).__name__}: {e}"
              print(f"  {raw_status}: {raw_body}")
          res["lanes"]["openrouter_free_raw"] = {"http": raw_status, "body": raw_body}

          # ---- engine-level result (only when the quota is actually there) --
          if raw_status == 200:
              print()
              print("=" * 68)
              print("ENGINE - free model, few-shot ON")
              print("=" * 68)
              r = roman_urdu.translate_lines(
                  LINES, model="nvidia/nemotron-3-ultra-550b-a55b:free", use_few_shot=True)
              print("  method   :", r.get("method"), "| ok:", r.get("ok"))
              print("  problems :", str(r.get("problems"))[:300])
              for l in (r.get("lines") or [])[:3]:
                  print("   line >", l[:100])
              res["lanes"]["openrouter_free_engine"] = {
                  "method": r.get("method"), "ok": bool(r.get("ok")),
                  "problems": str(r.get("problems"))[:300],
                  "lines": (r.get("lines") or [])[:3]}
          else:
              print("\n  free quota unavailable (HTTP %s) - engine call SKIPPED to "
                    "save the daily quota" % raw_status)
              res["lanes"]["openrouter_free_engine"] = {
                  "skipped": True, "reason": f"raw probe HTTP {raw_status}"}

          # ---- openai direct lane ------------------------------------------
          print()
          print("=" * 68)
          print("OPENAI direct lane (owner's key, api.openai.com)")
          print("=" * 68)
          ok_ = os.environ.get("OPENAI_API_KEY", "")
          if ok_:
              r3 = roman_urdu.translate_lines(
                  LINES, provider="openai", model="gpt-4o-mini",
                  api_key=ok_, use_few_shot=True)
              print("  method   :", r3.get("method"), "| ok:", r3.get("ok"))
              print("  problems :", str(r3.get("problems"))[:300])
              for l in (r3.get("lines") or [])[:3]:
                  print("   line >", l[:100])
              res["lanes"]["openai_direct"] = {
                  "method": r3.get("method"), "ok": bool(r3.get("ok")),
                  "problems": str(r3.get("problems"))[:300],
                  "lines": (r3.get("lines") or [])[:3]}
          else:
              print("  OPENAI_API_KEY not set -> skipped.")
              res["lanes"]["openai_direct"] = {"skipped": True, "reason": "no key"}

          # ---- gemini lane (the free lane that needs a key) ----------------
          print()
          print("=" * 68)
          print("GEMINI direct lane (free tier, own key)")
          print("=" * 68)
          gk = os.environ.get("GEMINI_API_KEY", "")
          if gk:
              r2 = roman_urdu.translate_lines(
                  LINES, provider="gemini", model="gemini-2.5-flash",
                  api_key=gk, use_few_shot=True)
              print("  method   :", r2.get("method"), "| ok:", r2.get("ok"))
              print("  problems :", str(r2.get("problems"))[:300])
              for l in (r2.get("lines") or [])[:3]:
                  print("   line >", l[:100])
              res["lanes"]["gemini_direct"] = {
                  "method": r2.get("method"), "ok": bool(r2.get("ok")),
                  "problems": str(r2.get("problems"))[:300],
                  "lines": (r2.get("lines") or [])[:3]}
          else:
              print("  GEMINI_API_KEY not set -> lane skipped.")
              print("  This is the free lane that needs a key (aistudio.google.com/apikey).")
              res["lanes"]["gemini_direct"] = {"skipped": True, "reason": "no key"}

          with open("news_agent/state/free_lane_check.json", "w") as f:
              json.dump(res, f, indent=1)
          print("\nwrote news_agent/state/free_lane_check.json")
          PY
      - name: record the probe result in the repo
        if: always()
        run: |
          git config user.name "azad-news-agent"
          git config user.email "agent@localhost"
          git add news_agent/state/free_lane_check.json
          if ! git diff --cached --quiet; then
            git commit -m "diag: translator lane probe $(date -u +%FT%TZ)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push || true
          fi

name: ig-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          TOK: ${{ secrets.FB_PAGE_TOKEN }}
          PID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          tok, pid = os.environ["TOK"], os.environ["PID"]
          def g(url):
              try:
                  with urllib.request.urlopen(url + ("&" if "?" in url else "?") +
                                              "access_token=" + tok, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"http_error": e.code, "body": e.read()[:220].decode(errors="ignore")}
          d = g(f"https://graph.facebook.com/v21.0/{pid}?fields=name,instagram_business_account.id,instagram_business_account.username")
          print("PAGE:", json.dumps(d, ensure_ascii=False)[:350])
          ig = ((d.get("instagram_business_account") or {}) if isinstance(d, dict) else {})
          if ig.get("id"):
              print("IG:", json.dumps(g(f"https://graph.facebook.com/v21.0/{ig['id']}?fields=username,media_count"), ensure_ascii=False)[:200])
          print("SCOPES:", json.dumps(g("https://graph.facebook.com/v21.0/me/permissions"), ensure_ascii=False)[:450])
          PY

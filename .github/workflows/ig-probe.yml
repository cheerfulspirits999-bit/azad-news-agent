name: ig-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          TOK: ${{ secrets.FB_PAGE_TOKEN }}
          PID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          tok, pid = os.environ["TOK"], os.environ["PID"]
          def g(url):
              try:
                  with urllib.request.urlopen(url + ("&" if "?" in url else "?") +
                                              "access_token=" + tok, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"http_error": e.code, "body": e.read()[:300].decode(errors="ignore")}
          print("PAGE_FIELDS:", json.dumps(g(f"https://graph.facebook.com/v21.0/{pid}?fields=name,instagram_business_account.id,instagram_business_account.username"), ensure_ascii=False)[:400])
          print("SCOPES:", json.dumps(g("https://graph.facebook.com/v21.0/me/permissions"), ensure_ascii=False)[:500])
          ig = (g(f"https://graph.facebook.com/v21.0/{pid}?fields=instagram_business_account").get("instagram_business_account") or {}).get("id")
          if ig:
              print("IG_PROFILE:", json.dumps(g(f"https://graph.facebook.com/v21.0/{ig}?fields=id,username,media_count,profile_picture_url"), ensure_ascii=False)[:300])
          else:
              print("IG_PROFILE: no linked account visible to this token")
          PY

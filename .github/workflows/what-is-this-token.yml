# One-shot: identify exactly what a pasted Facebook token is - 3 Oct.
#
# The owner's "permanent" token minted as valid=True, expires=0 (never expires)
# but /me/accounts returned an EMPTY list, so mint-token could not derive a page
# token and refused to store anything. This probes the token directly to say
# whether it is a user token, a page token, a system-user token, or belongs to a
# different user - and whether it can post to Azad Daily as-is.
#
# It posts NOTHING visible: the only write is a published=false phantom that is
# deleted immediately.
name: what-is-this-token
on:
  workflow_dispatch:
    inputs:
      token:
        description: "the Facebook token to identify"
        required: true
        default: ""
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: identify the token
        env:
          TOK: ${{ github.event.inputs.token }}
          PID: "1538679366414544"
          AID: ${{ secrets.FB_APP_ID || secrets.FACEBOOK_APP_ID }}
          SEC: ${{ secrets.FB_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          V = "v21.0"
          TOK = os.environ["TOK"].strip()
          PID = os.environ["PID"].strip()
          AID = os.environ["AID"].strip()
          SEC = os.environ["SEC"].strip()

          def call(url, data=None):
              qd = urllib.parse.urlencode(data).encode() if data else None
              req = urllib.request.Request(url, data=qd,
                      method="POST" if data else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.code, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="ignore")

          print("=" * 64)
          print("token length:", len(TOK))
          print("=" * 64)

          # 1. debug_token - what is it, who owns it, when does it expire
          c, b = call(f"https://graph.facebook.com/{V}/debug_token"
                      "?input_token=" + urllib.parse.quote(TOK) +
                      "&access_token=" + urllib.parse.quote(AID + "|" + SEC))
          print("\n### 1. debug_token ->", c)
          try:
              d = json.loads(b).get("data", {})
              for k in ("type", "app_id", "application", "user_id", "profile_id",
                        "is_valid", "expires_at", "granular_scopes"):
                  v = d.get(k)
                  if k == "granular_scopes" and v:
                      v = sorted(s.get("scope") for s in v if s.get("scope"))
                  print(f"    {k:16s}: {v}")
          except Exception:
              print("   ", b[:300])

          # 2. /me - whose token is this
          c, b = call(f"https://graph.facebook.com/{V}/me?fields=id,name,category"
                      "&access_token=" + urllib.parse.quote(TOK))
          print("\n### 2. GET /me ->", c, b[:220])

          # 3. /me/accounts - which pages does it administer
          c, b = call(f"https://graph.facebook.com/{V}/me/accounts"
                      "?fields=id,name,access_token&limit=50&access_token="
                      + urllib.parse.quote(TOK))
          print("\n### 3. GET /me/accounts ->", c)
          try:
              for p in json.loads(b).get("data", []):
                  print(f"    page {p.get('id')} {p.get('name')} "
                        f"tok_len={len(p.get('access_token',''))}")
              if not json.loads(b).get("data"):
                  print("    (EMPTY - this token administers no pages)")
          except Exception:
              print("   ", b[:250])

          # 4. direct access to Azad Daily - is it already a page token?
          c, b = call(f"https://graph.facebook.com/{V}/{PID}?fields=id,name,category"
                      "&access_token=" + urllib.parse.quote(TOK))
          print(f"\n### 4. GET /{PID} (Azad Daily) ->", c, b[:200])

          # 5. can it create a post? phantom only, deleted immediately
          c, b = call(f"https://graph.facebook.com/{V}/{PID}/feed", {
              "message": "azad-token-probe (phantom, not published)",
              "published": "false", "access_token": TOK})
          print("\n### 5. PHANTOM POST ->", c, b[:260])
          try:
              ph = json.loads(b).get("id")
          except Exception:
              ph = None
          if ph:
              c2, b2 = call(f"https://graph.facebook.com/{V}/{ph}",
                            {"method": "DELETE", "access_token": TOK})
              print("    phantom created+deleted -> CAN POST to Azad Daily")
          else:
              print("    !! cannot create posts with this token")

          # 6. if it is a page token, does a REAL post work?
          print("\n### 6. REAL TEXT POST (only if 5 succeeded)")
          c, b = call(f"https://graph.facebook.com/{V}/{PID}/feed", {
              "message": "azad-token-probe text", "stream_visibility": "PUBLIC",
              "access_token": TOK})
          print("   ->", c, b[:200])
          try:
              tid = json.loads(b).get("id")
              if tid:
                  print("    REAL POST ID:", tid)
                  print("    https://www.facebook.com/" + tid)
          except Exception:
              pass

          print("\n### VERDICT")
          print("  type 'PAGE' with a working phantom post  -> it IS a page token;")
          print("      store it directly as FB_PAGE_TOKEN, no exchange needed.")
          print("  /me returns a USER and /me/accounts is empty -> the user does not")
          print("      administer the Page with THIS app (check the app id).")
          PY
